name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://henseng:henseng@localhost:5432/henseng
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: henseng
          POSTGRES_PASSWORD: henseng
          POSTGRES_DB: henseng
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U henseng" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply migrations and seed (twice, to prove the seed is idempotent)
        run: pnpm db:deploy && pnpm db:seed && pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Super app web export
        run: pnpm app:build:web
